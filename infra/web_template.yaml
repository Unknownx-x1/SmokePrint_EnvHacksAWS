AWSTemplateFormatVersion: '2010-09-09'
Description: >
  SmokePrint Web App Frontend Hosting Stack (S3 + CloudFront CDN)
  AWS Free-tier compliant: S3 static hosting + CloudFront distribution (1 TB/mo data transfer free).

Resources:
  # ---------------------------------------------------------------------------
  # 1. S3 Bucket for Static Web Assets
  # ---------------------------------------------------------------------------
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'smokeprint-web-${AWS::AccountId}-${AWS::Region}'
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: 404.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub 'arn:aws:s3:::${WebBucket}/*'

  # ---------------------------------------------------------------------------
  # 2. CloudFront CDN Distribution
  # ---------------------------------------------------------------------------
  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: SmokePrint Web App Frontend Distribution
        DefaultRootObject: index.html
        Origins:
          - Id: S3WebsiteOrigin
            DomainName: !Select [1, !Split ['//', !GetAtt WebBucket.WebsiteURL]]
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginProtocolPolicy: http-only
        DefaultCacheBehavior:
          TargetOriginId: S3WebsiteOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
          Compress: true
        CustomErrorResponses:
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10

Outputs:
  WebBucketName:
    Description: S3 Static Website Hosting Bucket Name
    Value: !Ref WebBucket

  WebsiteUrl:
    Description: S3 Static Website Endpoint URL
    Value: !GetAtt WebBucket.WebsiteURL

  CloudFrontUrl:
    Description: CloudFront CDN Distribution URL
    Value: !Sub 'https://${WebDistribution.DomainName}'

  CloudFrontDistributionId:
    Description: CloudFront Distribution ID
    Value: !Ref WebDistribution
